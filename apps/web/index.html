<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Support desk for student email: Claude classifies each ticket and drafts a reply for an agent to review."
    />
    <!-- Vercel also sends X-Robots-Tag: noindex (vercel.json); this meta covers other hosts. -->
    <meta name="robots" content="noindex" />
    <!-- Link previews. Scrapers ignore relative URLs, so these are absolute and always name
         production, even on a Vercel preview deploy. og:description repeats the description
         above verbatim so the two cannot drift. The image is rendered from public/og-image.svg. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Helpdesk" />
    <meta property="og:title" content="Helpdesk" />
    <meta
      property="og:description"
      content="Support desk for student email: Claude classifies each ticket and drafts a reply for an agent to review."
    />
    <meta property="og:url" content="https://app.helpdesk.mahjoub.io/" />
    <meta property="og:image" content="https://app.helpdesk.mahjoub.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Helpdesk: student email in, drafted replies out." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Only until the stylesheet loads; index.css then sets color-scheme from the in-app theme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The sidebar navy of each theme, so the browser chrome continues the sidebar. Follows the
         system setting rather than the in-app toggle. -->
    <meta name="theme-color" content="#16243d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1522" media="(prefers-color-scheme: dark)" />
    <title>Helpdesk</title>
    <!-- Before the stylesheet paints, so a dark choice does not flash light on
         load. Same key and rule as src/hooks/use-theme.ts. -->
    <script>
      try {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
