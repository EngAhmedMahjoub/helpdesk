name: Deploy backend

# Task 8.7: a merge to main ships the API. It starts only once CI has passed on
# that commit, so a red main never reaches production; workflow_dispatch
# redeploys main by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway: a migration cut off
# between statements, or a hook fired for an image that was never pushed, is
# worse than waiting for the run ahead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/engahmedmahjoub/helpdesk-api

jobs:
  build:
    # A push to main that passed CI; not a PR run, and not a failed one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The commit CI tested, not whatever main has moved on to since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Seven characters, the same tags pushed by hand before this pipeline.
      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile --filter '@helpdesk/api'

      # Before the deploy, so the new code never meets an old schema. The direct
      # Neon string, not the -pooler one: Prisma Migrate takes an advisory lock.
      - name: Apply migrations to Neon
        working-directory: apps/api
        run: bun --bun run prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    steps:
      # The hook names the image tag: a service deployed from an image never
      # deploys on its own, and without imgURL Render would redeploy the last one.
      - name: Deploy the new image on Render
        run: |
          curl --fail --silent --show-error --get "$RENDER_DEPLOY_HOOK_URL" \
            --data-urlencode "imgURL=$IMAGE:$TAG"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ needs.build.outputs.tag }}
