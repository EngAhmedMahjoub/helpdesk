name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    # The API tests run against a real database rather than a mocked client, so
    # assertions like "logout deleted the session row" mean what they say.
    # Credentials match compose.yaml and apps/api/.env.test; the test database
    # itself is created by `prisma migrate deploy`.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The Prisma client is generated into apps/api/src/generated and is
      # gitignored, so it does not exist on a fresh checkout. prisma.config.ts
      # resolves DATABASE_URL even for generate, hence the placeholder: nothing
      # here connects to a database.
      - name: Generate Prisma client
        run: bun --filter '@helpdesk/api' db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run format:check
